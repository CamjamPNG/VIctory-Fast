name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      # This step asserts compile, clippy and every test that can run without a
      # GPU. The nine adapter-dependent victory-gpu tests are marked
      # `#[ignore = "needs a D3D12 adapter"]`, because a GitHub runner loses its
      # virtual device mid-run (HRESULT 0x887A0005) and they cannot pass here.
      # They are run by the owner: `cargo test -p victory-gpu -- --ignored`.
      - name: Tests
        run: cargo test --workspace --locked
