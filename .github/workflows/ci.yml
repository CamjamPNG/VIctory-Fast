name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The gate on demand. It runs against the branch it is asked for, which is
  # how the same tree can be checked a second and a third time without a push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    # A backstop above the per-test bound, not the bound itself: this build,
    # two clippy passes and 1,200 tests take about five minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - uses: taiki-e/install-action@nextest
      # Includes xtask's repository_passes_policy, the asset-policy check.
      # This step asserts compile, clippy and every test that can run without a
      # GPU. Some are `#[ignore]`d because a runner cannot satisfy them: in
      # victory-gpu the ones that want a real adapter, a switch, or a process
      # of their own (a runner loses its virtual device mid-run, HRESULT
      # 0x887A0005), and two victory-shader record-count tests, where the WARP
      # software adapter returns 0 and there is no SM 6.6 hardware branch to
      # fall back on. victory-gpu's are grouped by the configuration each one
      # needs, and the owner runs them as `docs/device-suite.md` says — not
      # `--ignored`, which was several configurations in one binary and read as
      # eleven bugs. victory-shader's two are run by the owner on real
      # hardware: `cargo test -p victory-shader -- --ignored`.
      #
      # Every test runs in a process of its own (nextest), so one test's
      # global state cannot stop or slow another, and no test can hold a lock
      # that another test is waiting for. `.config/nextest.toml` bounds each
      # test at two minutes and fails the run if one reaches it; a hang is
      # then a red build naming the test rather than a 60-minute cancel.
      # (There are no testable doc examples in the workspace: every code block
      # in a doc comment is marked `text`.)
      - name: Tests
        run: cargo nextest run --workspace --locked
