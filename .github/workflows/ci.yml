name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      # This step asserts compile, clippy and every test that can run without a
      # GPU. Two groups are `#[ignore]`d because a runner cannot satisfy them:
      # nine victory-gpu tests, where the runner loses its virtual device
      # mid-run (HRESULT 0x887A0005), and two victory-shader record-count tests,
      # where the WARP software adapter returns 0 and there is no SM 6.6
      # hardware branch to fall back on. Both are run by the owner on real
      # hardware: `cargo test -p victory-gpu -p victory-shader -- --ignored`.
      - name: Tests
        run: cargo test --workspace --locked
